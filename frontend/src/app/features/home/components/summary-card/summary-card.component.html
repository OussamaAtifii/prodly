<div
  class="relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-6 shadow-sm transition-all duration-200 hover:border-gray-300 hover:shadow-md"
>
  <div class="flex flex-col gap-5">
    <p class="text-sm font-medium text-gray-500">
      {{ title() }}
    </p>

    @if (loading()) {
      <div class="h-9 flex items-center">
        <app-spinner />
      </div>
    } @else {
      <div>
        <p class="text-4xl font-bold tracking-tight text-gray-900">
          {{ summary().current }}
        </p>

        <p class="mt-2 text-sm text-gray-500">
          <span class="font-medium text-fun-blue-700">
            {{ summary().percentage }}%
          </span>
          more from last month
        </p>
      </div>
    }
  </div>
</div>
