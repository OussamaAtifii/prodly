<main class="w-screen h-screen flex bg-gray-50">
  <!-- Sidebar -->
  <div
    class="relative w-1/3 h-full bg-fun-blue-700 overflow-hidden flex flex-col justify-between p-12 text-white"
  >
    <!-- Decorative shapes -->
    <div
      class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-white/10"
    ></div>

    <div
      class="absolute -bottom-40 -left-40 w-[30rem] h-[30rem] rounded-full bg-black/10"
    ></div>

    <!-- Logo -->
    <div class="relative z-10">
      <img
        src="/logo.webp"
        alt="Prodly"
        class="w-12 h-12 rounded-xl object-cover shadow-lg"
      />
    </div>

    <!-- Sidebar content -->
    <div class="relative z-10 max-w-sm">
      <p class="text-5xl font-bold leading-[1.1] tracking-tight">
        Start being productive.
      </p>

      <p class="mt-5 text-lg text-white/70 leading-relaxed">
        Create your account and start organizing your tasks with Prodly.
      </p>

      <div class="mt-8 flex items-center gap-3 text-sm text-white/70">
        <div class="flex -space-x-2">
          <div
            class="w-8 h-8 rounded-full bg-white/20 border-2 border-fun-blue-700"
          ></div>

          <div
            class="w-8 h-8 rounded-full bg-white/30 border-2 border-fun-blue-700"
          ></div>

          <div
            class="w-8 h-8 rounded-full bg-white/40 border-2 border-fun-blue-700"
          ></div>
        </div>

        <span>Everything in one place</span>
      </div>
    </div>

    <!-- Footer -->
    <p class="relative z-10 text-xs text-white/50">
      © 2026 Prodly. All rights reserved.
    </p>
  </div>

  <!-- Form -->
  <div class="flex-1 h-full flex items-center justify-center px-12">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="mb-10">
        <div class="flex items-center gap-3 mb-6">
          <img
            src="/logo.webp"
            alt="Prodly"
            class="w-10 h-10 rounded-xl object-cover"
          />

          <span class="text-xl font-bold text-gray-900"> Prodly </span>
        </div>

        <p class="text-4xl font-bold text-gray-900 tracking-tight">
          Create your account
        </p>

        <p class="mt-2 text-base text-gray-500">
          Register and start managing your tasks.
        </p>
      </div>

      <!-- Form -->
      <form
        [formGroup]="registerForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-5"
      >
        <!-- Username -->
        <div class="flex flex-col gap-2">
          <label for="username" class="text-sm font-semibold text-gray-800">
            Username
          </label>

          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Choose a username"
            autocomplete="username"
            class="w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-gray-900 placeholder:text-gray-400 shadow-sm outline-none transition-all duration-200 hover:border-gray-300 focus:border-fun-blue-700 focus:ring-4 focus:ring-fun-blue-700/10"
          />

          <app-print-error [control]="registerForm.controls.username" />
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-semibold text-gray-800">
            Email
          </label>

          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-gray-900 placeholder:text-gray-400 shadow-sm outline-none transition-all duration-200 hover:border-gray-300 focus:border-fun-blue-700 focus:ring-4 focus:ring-fun-blue-700/10"
          />

          <app-print-error [control]="registerForm.controls.email" />
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-2">
          <label for="password" class="text-sm font-semibold text-gray-800">
            Password
          </label>

          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Create a password"
            autocomplete="new-password"
            class="w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-gray-900 placeholder:text-gray-400 shadow-sm outline-none transition-all duration-200 hover:border-gray-300 focus:border-fun-blue-700 focus:ring-4 focus:ring-fun-blue-700/10"
          />

          <app-print-error [control]="registerForm.controls.password" />
        </div>

        <!-- Register -->
        <div class="flex flex-col gap-4 pt-2">
          @if (error()) {
            <div
              class="rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600"
            >
              {{ error() }}
            </div>
          }

          <button
            type="submit"
            [disabled]="registerForm.invalid || loading()"
            class="h-12 w-full rounded-xl bg-fun-blue-700 text-white font-semibold shadow-lg shadow-fun-blue-700/20 transition-all duration-200 hover:bg-fun-blue-800 hover:shadow-xl hover:shadow-fun-blue-700/25 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50 disabled:shadow-none flex items-center justify-center gap-2"
          >
            @if (loading()) {
              <app-spinner />
              <span>Creating account...</span>
            } @else {
              <span>Create account</span>
            }
          </button>

          <p class="text-center text-sm text-gray-500">
            Already have an account?
            <a
              [routerLink]="['/login']"
              class="font-semibold text-fun-blue-700 hover:text-fun-blue-800 hover:underline transition-colors"
            >
              Log in
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</main>
